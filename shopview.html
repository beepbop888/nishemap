<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=PT+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=43"><title>shop preview</title>
<style>body{display:block;height:auto;overflow:auto}.modal{position:static;display:block}.modal-card{max-height:none;animation:none;margin:0 auto}</style>
</head><body>
<section class="modal"><div class="modal-card">
<h2 class="form-title">Лавка аватаров</h2>
<p class="form-sub" id="shop-balance"><b>18</b> монет на руках · заработано за всё время: 23</p>
<div id="shop-body"></div>
</div></section>
<script src="config.js?v=43"></script><script src="data/seed.js?v=43"></script>
<script>window.NISHEMAP_OSM=null;</script>
<script src="js/app.js?v=43"></script>
<script>
// рисуем витрину напрямую, чтобы увидеть карточки
setTimeout(function(){
  var A=[["student","студент","живу на дошике до стипендии",0],["office","офисный","обед за свой счёт, увы",0],
  ["doshik","дошик-энджоер","кипяток — мой шеф-повар",0],["investor","инвестор","экономлю, чтобы вложиться",0],
  ["babushka","запасливый","у меня всё с собой",0],["shaurmaster","шаурмастер","знает лучший лаваш",5],
  ["tsar","царь столовой","компот без очереди",12],["kosmonavt","космонавт","ел борщ в невесомости",25],
  ["oligarkh","олигарх","берёт добавку не глядя",40],["legenda","легенда района","его цены цитируют",60]];
  var b=document.getElementById("shop-body");
  [["Бесплатные",0],["За монеты",1]].forEach(function(g){
    var h=document.createElement("h3");h.className="shop-group";h.textContent=g[0];b.appendChild(h);
    var grid=document.createElement("div");grid.className="shop-grid";
    A.filter(function(a){return g[1]?a[3]:!a[3];}).forEach(function(a,i){
      var c=document.createElement("button");c.className="shop-card"+(a[0]==="doshik"?" is-active":"")+(a[3]>18?" is-locked":"");
      c.innerHTML='<svg width="48" height="48" viewBox="0 0 32 32"><circle cx="16" cy="16" r="16" fill="#f6f5f1"/><circle cx="16" cy="13" r="6" fill="#e8c9a0"/></svg>'+
      '<span class="shop-name">'+a[1]+'</span><span class="shop-desc">'+a[2]+'</span>'+
      '<span class="shop-tag">'+(a[0]==="doshik"?"надет":a[3]?'<span class="coin coin--gold"></span>'+a[3]:"выбрать")+'</span>';
      grid.appendChild(c);});
    b.appendChild(grid);});
},300);
</script></body></html>
