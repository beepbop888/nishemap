name = "nishemap-bot"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = true

# Секретов в файле нет и быть не может. Ставятся один раз руками:
#   npx wrangler secret put BOT_TOKEN            --config worker/wrangler.toml
#   npx wrangler secret put WEBHOOK_SECRET       --config worker/wrangler.toml
#   npx wrangler secret put SUPABASE_SERVICE_KEY --config worker/wrangler.toml
[vars]
SITE = "https://beepbop888.github.io/nishemap/"
SUPABASE_URL = "https://svfnjfpawljkdcehzkgv.supabase.co"
# Цена месяца ДрищMap в звёздах Telegram. Курс звезды к рублю Telegram меняет
# сам, поэтому держим числом здесь, а не в коде: 499 ₽ — это примерно 250 звёзд,
# но перед запуском стоит свериться с текущим курсом в @BotFather.
DRISHA_STARS = "250"

# Пульс, чтобы Supabase не усыпил проект.
# На бесплатном тарифе проект ставят на паузу примерно после недели без
# обращений, и тогда карта теряет цены, монеты и модерацию разом. Раз в шесть
# часов воркер сам дёргает базу — этого хватает, и это не зависит ни от
# посетителей, ни от GitHub Actions (тот отключает расписание, если в репозиторий
# 60 дней не коммитят).
[triggers]
crons = ["17 */6 * * *"]
